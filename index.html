<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionPath — AI Career & Education Advisor</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('visionpath-theme') || localStorage.getItem('vp_dark_mode');
          var isDark = false;
          if (saved !== null) {
            isDark = saved === 'dark' || saved === 'true' || saved === '"dark"';
          } else {
            isDark = false; // Default to Light Mode
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
