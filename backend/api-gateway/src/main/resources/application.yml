server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          # ==============================
          # GLOBAL CORS CONFIGURATION
          # ==============================
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:5174"
                  - "http://localhost:3000"
                  - "http://127.0.0.1:5173"
                  - "http://127.0.0.1:5174"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

          # ==============================
          # MICROSERVICE ROUTES
          # ==============================
          routes:

            # --------------------------------
            # AUTH SERVICE - 8081
            # --------------------------------
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            # --------------------------------
            # STUDENT SERVICE - 8082
            # --------------------------------
            - id: student-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/students/**

            # --------------------------------
            # CAREER SERVICE - 8083
            # --------------------------------
            - id: career-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/careers/**

            # --------------------------------
            # EDUCATION SERVICE - 8084
            # --------------------------------
            - id: education-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/education/**

            # --------------------------------
            # JOBS SERVICE - 8085
            # --------------------------------
            - id: jobs-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/jobs/**

            # --------------------------------
            # ASSESSMENT SERVICE - 8086
            # --------------------------------
            - id: assessment-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/assessments/**

            # --------------------------------
            # AI MENTOR SERVICE - 8087
            # --------------------------------
            - id: ai-mentor-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/ai/**

            # --------------------------------
            # STUDY PLAN SERVICE - 8088
            # --------------------------------
            - id: study-plan-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/study-plans/**

            # --------------------------------
            # PROGRESS SERVICE - 8089
            # --------------------------------
            - id: progress-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/progress/**

            # --------------------------------
            # COUNSELOR SERVICE - 8090
            # --------------------------------
            - id: counselor-service
              uri: http://localhost:8090
              predicates:
                - Path=/api/counselors/**

            # --------------------------------
            # NOTIFICATION SERVICE - 8091
            # --------------------------------
            - id: notification-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/notifications/**

            # --------------------------------
            # ADMIN SERVICE - 8092
            # --------------------------------
            - id: admin-service
              uri: http://localhost:8092
              predicates:
                - Path=/api/admin/**

            # --------------------------------
            # RESUME ANALYZER SERVICE - 8093
            # --------------------------------
            - id: resume-analyzer-service
              uri: http://localhost:8093
              predicates:
                - Path=/api/resumes/**


# ==========================================
# ACTUATOR
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always