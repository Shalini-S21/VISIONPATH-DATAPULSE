server.port=8087
spring.application.name=ai-mentor-service

# AI API Key — optional. If not set, fallback responses are used.
# Set this environment variable to enable AI responses:
# export AI_API_KEY=your_openai_or_gemini_key
app.ai.api-key=${AI_API_KEY:}
app.ai.provider=${AI_PROVIDER:fallback}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
management.endpoints.web.exposure.include=health,info
