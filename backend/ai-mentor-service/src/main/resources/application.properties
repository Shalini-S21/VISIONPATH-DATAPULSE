server.port=8087
spring.application.name=ai-mentor-service

# AI API Key — optional. If not set, fallback responses are used.
# Set this environment variable to enable AI responses:
# export AI_API_KEY=your_openai_or_gemini_key
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
management.endpoints.web.exposure.include=health,info
